<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#eadcc4">
<title>復古轉盤電話｜解壓小遊戲</title>
<style>
*{box-sizing:border-box} body{margin:0;min-height:100svh;background:linear-gradient(145deg,#f8f0e2,#dfc9a8);color:#342a23;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;display:grid;place-items:center;padding:18px}
.app{width:min(100%,440px);text-align:center}.eyebrow{font-size:11px;letter-spacing:3px;color:#8c755e;margin-bottom:7px}h1{font-family:Georgia,serif;font-size:25px;letter-spacing:2px;margin:0 0 18px}
.phone{background:linear-gradient(145deg,#c96750,#9f4034);border:6px solid #86382e;border-radius:38px;padding:18px 15px 20px;box-shadow:0 18px 35px #4d30264d,inset 0 2px 5px #ffffff55}
.receiver{height:38px;width:78%;margin:0 auto 15px;border-radius:30px;background:linear-gradient(#393633,#111);box-shadow:0 5px 6px #62251f}
.screen{background:#f5e9d1;border:3px solid #7d382e;border-radius:10px;padding:8px;margin:0 auto 15px;width:85%;box-shadow:inset 0 2px 6px #775b4033}.screen small{font-size:10px;letter-spacing:2px;color:#947b60}.digits{font:26px/1.4 ui-monospace,monospace;letter-spacing:4px;min-height:37px;overflow-wrap:anywhere}
.dial-area{width:min(78vw,300px);height:min(78vw,300px);margin:0 auto;position:relative;touch-action:none;user-select:none}
.plate{position:absolute;inset:0;border-radius:50%;border:9px solid #625344;background:radial-gradient(circle,#e9dcc2 0 37%,#b6a487 38% 41%,#f6ecd8 42% 68%,#95836b 69% 72%,#d5c3a2 73%);box-shadow:0 8px 14px #451d1b88,inset 0 3px 8px #fff8;transform:rotate(0deg);touch-action:none}
.number{position:absolute;width:19%;height:19%;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 32% 25%,#fffdf5,#c9b99c 72%,#8c7a62);border:3px solid #89775e;box-shadow:inset 0 2px 4px #fff9,0 2px 3px #57432d55;color:#42362c;font:700 clamp(18px,5vw,23px) Georgia;cursor:grab;touch-action:none;z-index:2}
.number:active{filter:brightness(1.05)}
.hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:28%;height:28%;border-radius:50%;display:grid;place-items:center;text-align:center;background:radial-gradient(circle at 35% 25%,#fff7e7,#b79c72);border:5px solid #8e7959;color:#70593e;font:10px Georgia;letter-spacing:1px;pointer-events:none;z-index:3}
.stopper{position:absolute;right:-3px;top:31%;width:18px;height:72px;border-radius:9px;background:linear-gradient(90deg,#65513b,#f0dfba,#796448);box-shadow:2px 3px 5px #3c241e;z-index:4;pointer-events:none}
.actions{display:flex;justify-content:center;gap:10px;margin-top:17px}button{border:0;border-radius:24px;padding:11px 18px;background:#f4e7ce;color:#553d2c;font-weight:700;letter-spacing:1px;box-shadow:0 3px 0 #9c7652;font-size:14px}button:active{transform:translateY(2px);box-shadow:0 1px 0 #9c7652}
#status{min-height:40px;color:#fff1d9;font-size:13px;line-height:1.6;margin-top:13px}.help{font-size:12px;color:#756653;line-height:1.8;margin:14px 8px 0}.dragging{cursor:grabbing}
</style>
</head>
<body>
<main class="app">
<div class="eyebrow">A LITTLE MOMENT OF CALM</div><h1>復古轉盤電話</h1>
<section class="phone">
<div class="receiver"></div>
<div class="screen"><small>你撥出的號碼</small><div class="digits" id="digits">— — — — — —</div></div>
<div class="dial-area" id="dialArea">
<div class="plate" id="plate">
  <div class="number" data-n="1" style="left:40.5%;top:5.5%">1</div>
  <div class="number" data-n="2" style="left:58.5%;top:11.5%">2</div>
  <div class="number" data-n="3" style="left:72%;top:25.5%">3</div>
  <div class="number" data-n="4" style="left:77%;top:44%">4</div>
  <div class="number" data-n="5" style="left:69%;top:62%">5</div>
  <div class="number" data-n="6" style="left:51%;top:71%">6</div>
  <div class="number" data-n="7" style="left:32%;top:68%">7</div>
  <div class="number" data-n="8" style="left:17%;top:53%">8</div>
  <div class="number" data-n="9" style="left:13%;top:34%">9</div>
  <div class="number" data-n="0" style="left:23%;top:16%">0</div>
  <div class="hub">HELLO<br>♡</div>
  <div class="stopper"></div>
</div>
</div>
<div class="actions"><button id="reset">清除重來</button><button id="call">撥出去 ☎</button></div>
<div id="status" aria-live="polite">直接按住數字孔，沿著順時針方向拖到右側擋片，再放開。</div>
</section>
<p class="help">操作方式：手指按住數字圓孔 → 順時針拖動 → 放開，轉盤會回彈並記錄數字。也可以用滑鼠拖動。這是模擬解壓玩具，不會真的撥打電話。</p>
</main>
<script>
(() => {
 const area=document.getElementById('dialArea'), plate=document.getElementById('plate');
 const display=document.getElementById('digits'), status=document.getElementById('status');
 const values=[]; let active=false, pointerId=null, last=null, turns=0, selected=null, animating=false;
 const center=()=>{const r=area.getBoundingClientRect();return {x:r.left+r.width/2,y:r.top+r.height/2}};
 const angle=e=>{const c=center();return Math.atan2(e.clientY-c.y,e.clientX-c.x)*180/Math.PI};
 const render=()=>display.textContent=values.length?values.join(' '):'— — — — — —';
 const norm=d=>{while(d>180)d-=360;while(d< -180)d+=360;return d};
 function onDown(e){
   const hole=e.target.closest('.number');
   if(!hole||animating)return;
   e.preventDefault(); active=true; pointerId=e.pointerId; selected=hole.dataset.n;
   last=angle(e); turns=0; hole.classList.add('dragging');
   try{area.setPointerCapture(pointerId)}catch(_){}
   status.textContent='很好，繼續順時針轉到擋片的位置再放開。';
 }
 function onMove(e){
   if(!active||e.pointerId!==pointerId)return;
   e.preventDefault(); const now=angle(e), delta=norm(now-last); 
   // Ignore small reverse jitter; only accumulate clockwise movement.
   if(delta>0) turns+=delta;
   last=now;
   const visual=Math.min(turns,330);
   plate.style.transform=`rotate(${visual}deg)`;
   if(turns>18)status.textContent='再轉一點點，然後放開 ♡';
 }
 function onUp(e){
   if(!active||(e.pointerId!==undefined&&e.pointerId!==pointerId))return;
   active=false; document.querySelectorAll('.number').forEach(x=>x.classList.remove('dragging'));
   try{if(pointerId!==null&&area.hasPointerCapture(pointerId))area.releasePointerCapture(pointerId)}catch(_){}
   pointerId=null;
   if(turns<12){plate.style.transition='transform .35s ease-out';plate.style.transform='rotate(0deg)';setTimeout(()=>plate.style.transition='',360);status.textContent='要從數字孔開始拖喔！按住圓孔再順時針滑動。';return}
   animating=true;
   const target=selected==='0'?330:Number(selected)*33;
   const start=Math.min(turns,330), end=Math.max(start,target);
   plate.style.transition='transform .24s ease-out';plate.style.transform=`rotate(${end}deg)`;
   setTimeout(()=>{
     if(values.length<10){values.push(selected);render();status.textContent=`記下 ${selected} 了！轉盤正在回彈 ♡`;}
     else status.textContent='已經輸入 10 個數字，清除後可以再玩。';
     plate.style.transition='transform .7s cubic-bezier(.2,.75,.25,1)';plate.style.transform='rotate(0deg)';
     setTimeout(()=>{plate.style.transition='';animating=false;},720);
   },250);
 }
 area.addEventListener('pointerdown',onDown,{passive:false});
 area.addEventListener('pointermove',onMove,{passive:false});
 area.addEventListener('pointerup',onUp);
 area.addEventListener('pointercancel',onUp);
 document.getElementById('reset').addEventListener('click',()=>{values.length=0;render();turns=0;selected=null;active=false;animating=false;plate.style.transition='transform .3s';plate.style.transform='rotate(0deg)';status.textContent='清空了！再按住任一數字孔開始玩吧 ♡';setTimeout(()=>plate.style.transition='',320)});
 document.getElementById('call').addEventListener('click',()=>{if(!values.length){status.textContent='先轉幾個數字，再來撥出去吧！';return}const lines=['嘟——嘟—— 今天也要好好照顧自己喔。','您好，這裡是快樂補給站，送你一點好心情！','叮！你的今日份好運正在派送中 ♡','宇宙提醒你：休息一下也沒關係。','喂？你真的已經做得很好了。'];status.textContent=lines[Math.floor(Math.random()*lines.length)]});
 render();
})();
</script>
</body></html>
